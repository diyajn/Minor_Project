spring.application.name=DevPathTracker

# ---- Everything sensitive comes from environment variables (set them in Railway) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

app.swagger.server-url=${SWAGGER_SERVER_URL:http://localhost:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}

# Comma-separated list of frontend origins allowed to call this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
